# Install and production build. Node engines match package.json.
name: ci

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # Node 18: Tailwind oxide native binding often fails under `npm ci`
        # (npm optional-deps bug). Engines still allow 18 for Vite's range;
        # CI proves the supported LTS builds.
        node-version: ["20", "22"]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm

      - name: npm ci
        run: npm ci

      - name: npm run build
        run: npm run build
